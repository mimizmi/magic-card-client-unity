name: harness-verification

on:
  pull_request:
  push:
    branches:
      # The default branch is master. This said `main` from the first commit, so
      # no push to the trunk has ever triggered this workflow; only pull_request
      # did any work at all.
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify architecture and package pins
        shell: pwsh
        run: ./Tools/ci/verify-architecture.ps1

  # Opt-in, and deliberately NOT part of the pull-request gate.
  #
  # This job needs a runner labelled [self-hosted, Windows, unity-6000.2.7f2]. No
  # such runner is registered on this repository -- the runner count is zero -- so
  # from the first commit until this comment it could never start. It sat
  # permanently "skipped" behind a failing `needs: architecture`, and a skipped
  # check reads on a pull request very much like one that ran and passed. Making
  # it manual-only is the honest state: the checks list no longer implies a Unity
  # suite that CI has never once executed.
  #
  # docs/verification-matrix.md is the authority on what that costs -- the Unity
  # suite is a LOCAL gate, not a CI gate. To promote it back to a CI gate, register
  # a runner carrying those three labels and delete the `if:` below; nothing else
  # here needs to change.
  unity-tests:
    needs: architecture
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, unity-6000.2.7f2]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pinned NuGetForUnity CLI
        shell: pwsh
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore packages.config
        shell: pwsh
        run: ./Tools/ci/restore-nuget.ps1

      - name: Run EditMode and PlayMode tests
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH_6000_2_7F2 }}
        run: ./Tools/ci/run-unity-tests.ps1 -PreferConnectedEditor:$false

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-harness-test-results
          path: |
            Artifacts/
            Logs/
          if-no-files-found: warn
          retention-days: 14
