name: harness-verification

on:
  pull_request:
  push:
    branches:
      # The default branch is master. This said `main` from the first commit, so
      # no push to the trunk has ever triggered this workflow; only pull_request
      # did any work at all.
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify architecture and package pins
        shell: pwsh
        run: ./Tools/ci/verify-architecture.ps1

  # Part of the pull-request gate, as of the runner registration described below.
  #
  # This job needs a runner labelled [self-hosted, Windows, unity-6000.2.7f2]. For
  # most of this repository's history no such runner existed -- the count was zero
  # -- so the job could never start. It sat permanently "skipped", and a skipped
  # check reads on a pull request very much like one that ran and passed, which is
  # why it was made manual-only rather than left looking green.
  #
  # A self-hosted runner now carries those labels, so the `if:` is gone and the job
  # runs on every pull request and push. See "CI boundary" in
  # docs/verification-matrix.md for what that changes.
  #
  # SECURITY: this repository is public and the runner is self-hosted, so a fork's
  # pull request would otherwise execute arbitrary code on the owner's machine.
  # Actions must keep "Require approval for all outside collaborators" (or
  # stricter) enabled in repository settings. Do not relax that while this job
  # triggers on `pull_request`.
  unity-tests:
    needs: architecture
    runs-on: [self-hosted, Windows, unity-6000.2.7f2]
    # A fresh workspace imports every asset first -- this project carries XLua's
    # native plugins for four platforms -- which costs far more than the ~1 minute
    # the suite itself takes. Later runs reuse Library.
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Library/ is gitignored, so the default `clean: true` (git clean -ffdx)
          # deletes it and forces a full reimport on every run.
          clean: false

      - name: Install pinned NuGetForUnity CLI
        shell: pwsh
        run: |
          dotnet tool install --global NuGetForUnity.Cli --version 4.5.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Restore packages.config
        shell: pwsh
        run: ./Tools/ci/restore-nuget.ps1

      - name: Run EditMode and PlayMode tests
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH_6000_2_7F2 }}
        run: ./Tools/ci/run-unity-tests.ps1 -PreferConnectedEditor:$false

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-harness-test-results
          path: |
            Artifacts/
            Logs/
          if-no-files-found: warn
          retention-days: 14
